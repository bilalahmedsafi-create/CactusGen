name: release

# Builds the Windows installer on GitHub's machines and attaches it to a GitHub
# Release, so anyone can download CactusGen from the Releases page.
#
#   - Push a version tag:   git tag v1.2.3 && git push --tags
#     → builds and publishes the release "CactusGen v1.2.3" with the installer.
#   - Or by hand:           Actions → release → Run workflow
#     → builds the version in src-tauri/tauri.conf.json and creates (or updates)
#       the release v<version>. If that tag doesn't exist yet, GitHub creates it
#       on the commit you ran the workflow from.
#
# No secrets to set up: the installer is not code-signed (Windows SmartScreen
# warns once — "More info → Run anyway"). Takes about 15–20 minutes; later runs
# are faster thanks to the Rust cache.
#
# macOS: an unsigned Apple Silicon .dmg is built too. Without an Apple
# Developer ID certificate + notarization Gatekeeper blocks it on first launch,
# so the release notes give Mac users the one-time `xattr -cr` fix. See
# DESKTOP.md "Signed & notarized release build" for a signed build on a Mac.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the release and upload the installer

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # Baked into the app at build time (lib/appInfo.ts): the update check and
      # the GitHub buttons follow the repository this workflow runs in, so a
      # fork's users are pointed at the fork's releases, not upstream's.
      NEXT_PUBLIC_GITHUB_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json "packageManager" (pnpm@9.15.9).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # The bundled server uses node:sqlite → Node 22+. This exact Node
          # binary is what ships inside the installer.
          node-version: 22
          cache: pnpm

      - name: Check the version files agree (and match the tag)
        id: meta
        run: |
          node scripts/desktop/check-version.mjs
          echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install JS dependencies
        # node-linker=hoisted gives a plain, flat node_modules (no symlinks or
        # junctions): the layout the desktop staging step is tested with on
        # Windows. Only for this CI checkout; nothing is committed.
        run: |
          echo "node-linker=hoisted" >> .npmrc
          pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Runs `pnpm tauri build --bundles nsis`, whose beforeBuildCommand
      # (scripts/desktop/build-server.mjs) builds Next.js, stages the server and
      # stages node.exe as binaries/helios-node-x86_64-pc-windows-msvc.exe.
      # Then creates/updates the release and uploads the -setup.exe to it.
      - name: Build the installer and publish the release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          args: --bundles nsis
          tagName: v${{ steps.meta.outputs.version }}
          releaseName: CactusGen v${{ steps.meta.outputs.version }}
          releaseBody: |
            ### Windows
            Download **CactusGen_${{ steps.meta.outputs.version }}_x64-setup.exe** below and run it. No admin rights needed.

            The installer is not code-signed yet, so Windows SmartScreen may say "Windows protected your PC". Click **More info → Run anyway**.

            ### Mac (Apple Silicon: M1, M2, M3, M4…)
            Download **CactusGen_${{ steps.meta.outputs.version }}_aarch64.dmg** below (it appears a few minutes after the Windows file), open it and drag CactusGen into Applications.

            The app is not signed by Apple yet, so macOS blocks the first launch ("damaged" or "can't be opened"). Open **Terminal** once and run:
            ```
            xattr -cr /Applications/CactusGen.app
            ```
            Then open CactusGen normally.

            First launch: open **Settings → API Keys** and paste your API key.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false

      # The .msi is a bonus. It is built from the binaries compiled above
      # (`tauri bundle` = packaging only) and never blocks the release.
      - name: Build an .msi too (optional)
        id: msi
        continue-on-error: true
        run: pnpm tauri bundle --bundles msi

      - name: Attach the .msi to the release
        if: steps.msi.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ steps.meta.outputs.version }}" \
            src-tauri/target/release/bundle/msi/*.msi \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Keep the installers as a workflow artifact too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CactusGen-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 14

      - name: Summary
        if: success()
        run: |
          {
            echo "### CactusGen v${{ steps.meta.outputs.version }}"
            echo ""
            echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${{ steps.meta.outputs.version }}"
            echo ""
            echo "MSI: ${{ steps.msi.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Apple Silicon build. Not signed or notarized (no Apple Developer ID), so the
  # release notes tell Mac users to clear the quarantine flag once with
  # `xattr -cr`. Runs in parallel with the Windows job; the Windows job creates
  # the release, this one waits for it and attaches the .dmg.
  macos:
    name: macOS installer (Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_GITHUB_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Official nodejs.org build (self-contained): build-server.mjs ships
          # this exact binary inside the app.
          node-version: 22
          cache: pnpm

      - name: Check the version files agree (and match the tag)
        id: meta
        run: |
          node scripts/desktop/check-version.mjs
          echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install JS dependencies
        run: |
          echo "node-linker=hoisted" >> .npmrc
          pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # CI=true (set by GitHub) makes Tauri's dmg script skip the Finder window
      # styling, which needs a logged-in desktop session.
      - name: Build the app and the .dmg
        run: pnpm tauri build --bundles app,dmg

      - name: Attach the .dmg to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.meta.outputs.version }}"
          # The Windows job creates the release; wait up to 40 minutes for it.
          for i in $(seq 1 80); do
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            sleep 30
          done
          gh release upload "$tag" src-tauri/target/release/bundle/dmg/*.dmg \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Keep the .dmg as a workflow artifact too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CactusGen-macos-arm64
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
          retention-days: 14
